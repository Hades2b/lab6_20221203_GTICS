<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="navbar-expand-md sub-navbar">
    <div class="collapse navbar-collapse" id="navbar-menu">
        <div class="navbar">
            <div class="container-xl">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/heroes}">
                            <span class="nav-link-title">Inicio</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/intencion}">
                            <span class="nav-link-title">Petición</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/canciones}">
                            <span class="nav-link-title">Canciones</span>
                        </a>
                    </li>
                    <th:block sec:authorize="hasRole('ADMIN')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/canciones/listaAsignaciones}">
                            <span class="nav-link-title">Lista Asignaciones</span>
                        </a>
                    </li>
                    </th:block>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/NADA}">
                            <span class="nav-link-title">NADA</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/NADA}">
                            <span class="nav-link-title">NADA</span>
                        </a>
                    </li>


                    <li class="nav-item ml-5">
                        <th:block sec:authorize="!isFullyAuthenticated()">
                            <a th:href="@{/login}" class="btn btn-primary">Iniciar Sesión</a>
                        </th:block>
                        <th:block sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-secondary">Cerrar Sesión</button>
                            </form>
                        </th:block>
                    </li>

                </ul>

            </div>
        </div>
    </div>
</header>
</body>
</html>
