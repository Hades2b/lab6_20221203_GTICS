<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Héroe Naval</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="container-xl mt-4">
    <h2>Registrar héroe naval</h2>

    <form th:action="@{/heroes}" th:object="${heroe}" method="post" class="card p-3">

        <!-- Nombre -->
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" id="nombre" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <!-- Fecha de nacimiento -->
        <div class="mb-3">
            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
            <input type="date" th:field="*{fechaNacimiento}" id="fechaNacimiento" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
        </div>

        <!-- Reseña -->
        <div class="mb-3">
            <label for="resena" class="form-label">Reseña</label>
            <textarea th:field="*{resena}" id="resena" class="form-control"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('resena')}" th:errors="*{resena}"></div>
        </div>

        <!-- País -->
        <div class="mb-3">
            <label for="pais" class="form-label">País</label>
            <input type="text" th:field="*{pais}" id="pais" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}"></div>
        </div>

        <!-- ComboBox de Rango -->
        <div class="mb-3">
            <label for="rango" class="form-label">Rango</label>
            <select th:field="*{rango}" id="rango" class="form-select">
                <option value="" disabled selected>-- Selecciona un rango --</option>
                <option th:each="rang : ${listaRangos}"
                        th:value="${rango.idRango}"
                        th:text="${rango.nombreRango}">
                </option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('rango')}" th:errors="*{rango}"></div>
        </div>

        <!-- Botones -->
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/heroes}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
