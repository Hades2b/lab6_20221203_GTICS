<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Asignación</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <!-- Bootstrap opcional -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <div class="card">
        <div class="card-header">
            <h5>Crear Nueva Asignación</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/canciones/asignar}" th:object="${nuevaAsignacionDto}" method="post">

                <!-- Selección de usuario solicitante -->
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario solicitante</label>
                    <select id="usuario" class="form-select" th:field="*{idUsuario}" required>
                        <option value="" disabled selected>-- Seleccione un usuario --</option>
                        <option th:each="u : ${listaUsuariosSolicitantes}"
                                th:value="${u.id}"
                                th:text="${u.nombre}"></option>
                    </select>
                </div>

                <!-- Selección de canción -->
                <div class="mb-3">
                    <label for="cancion" class="form-label">Canción</label>
                    <select id="cancion" class="form-select" th:field="*{idCancion}" required>
                        <option value="" disabled selected>-- Seleccione una canción --</option>
                        <option th:each="c : ${listaCanciones}"
                                th:value="${c.id}"
                                th:text="${c.titulo}"></option>
                    </select>
                </div>

                <!-- Botón de guardar -->
                <button type="submit" class="btn btn-primary">Guardar Asignación</button>
                <a th:href="@{/canciones/listaAsignaciones}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

</div>
</body>
</html>
