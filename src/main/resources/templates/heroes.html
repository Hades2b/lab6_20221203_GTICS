<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Heroes</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div>
</div>
<div class="container mt-4">
    <header th:replace="header :: header"></header>

    <div th:if="${msg}" class="alert alert-success" role="alert" th:text="${msg}">
        Mensaje
    </div>



    <div class="mb-3" sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/heroes/nuevo}" class="btn btn-primary">Nuevo Héroe</a>
    </div>
    <div class="row justify-content-between">
        <div class="col-12">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4 mb-4" th:each="heroe : ${listaHeroes}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-baseline">
                                    <h5 class="card-title mb-0 mr-2" th:text="${heroe.nombre}">Nombre Completo</h5>
                                    <span class="badge align-self-center" th:text="'Rango: '+${heroe.rango.nombreRango}">Rango</span>
                                    <span class="badge align-self-center" th:text="'Pais: '+${heroe.pais}">Pais</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <p class="card-text flex-grow-1" th:text="${heroe.resena}">Descripción</p>

                            <div class="mt-auto">
                                <div class="d-flex align-items-center mb-3">
                                    <i class="fas fa-envelope text-muted mr-2"></i>
                                    <small class="text-muted" th:text="${#temporals.format(heroe.fechaNacimiento, 'dd/MM/yyyy')}">Fe</small>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
