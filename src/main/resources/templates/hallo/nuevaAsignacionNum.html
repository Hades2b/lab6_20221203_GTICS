<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Asignación</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="container mt-4">
    <header th:replace="header :: header"></header>

    <div class="card">
        <div class="card-header">
            <h5>Crear Nueva Asignación</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/halloween/asignar}" th:object="${nuevaAsignacionNumDto}" method="post">

                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario solicitante</label>
                    <select id="usuario" class="form-select" th:field="*{idUsuario}" required>
                        <option value="" disabled selected>-- Seleccione un usuario --</option>
                        <option th:each="u : ${listaUsuariosSolicitantes}"
                                th:value="${u.usuario.id}"
                                th:text="${u.usuario.nombre}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="numObjetivo" class="form-label">Número objetivo</label>
                    <input type="number" id="numObjetivo" class="form-control"
                           th:field="*{numObjetivo}" min="10" max="64" required>
                </div>

                <button type="submit" class="btn btn-primary">Guardar Asignación</button>
                <a th:href="@{/halloween/listaAsignaciones}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

</div>
</body>
</html>
