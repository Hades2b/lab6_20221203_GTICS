<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Mesa</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <header th:replace="header :: header"></header>

    <h2>Detalle de Mesa</h2>

    <div th:if="${msg}" class="alert alert-success" role="alert" th:text="${msg}">
        Mensaje
    </div>
    <a th:href="@{'/reservas/mesas'}" class="btn btn-secondary btn-sm">Ver Todas</a>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Mesa ID: <span th:text="${mesa.id}"></span></span>
<!--            &lt;!&ndash; Botón para liberar mesa &ndash;&gt;-->
<!--            <form th:action="@{'/mesas/' + ${mesa.id} + '/liberar'}" method="post" class="mb-0">-->
<!--                <button type="submit" class="btn btn-danger btn-sm">Liberar Mesa</button>-->
<!--            </form>-->
        </div>
        <div class="card-body">
            <form th:action="@{'/reservas/mesas/' + ${mesa.id} + '/actualizar'}" th:object="${mesa}" method="post">
                <div class="mb-3">
                    <label for="numero" class="form-label">Número</label>
                    <input type="number" id="numero" th:field="*{numero}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="capacidad" class="form-label">Capacidad</label>
                    <input type="number" id="capacidad" th:field="*{capacidad}" class="form-control" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" id="disponible" th:field="*{disponible}" class="form-check-input">
                    <label for="disponible" class="form-check-label">Disponible</label>
                </div>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Reservas de esta mesa</h5>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID Reserva</th>
                    <th>Usuario</th>
                    <th>Fecha de Reserva</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="reserva : ${mesa.reservas}">
                    <td th:text="${reserva.id}"></td>
                    <td th:text="${reserva.usuario.nombre}"></td>
                    <td th:text="${#temporals.format(reserva.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <form th:action="@{'/reservas/' + ${reserva.id} + '/eliminar'}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(mesa.reservas)}">
                    <td colspan="4" class="text-center text-muted">No hay reservas para esta mesa</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
